<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>登录 · 活态泉州 | Login · Living Quanzhou</title>
        <link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400&family=Inter:wght@300;400;500;600;700&family=Ma+Shan+Zheng&display=swap">
        <style>:root { --color-brick: #B5493B; --color-brick-dark: #8E372C; --color-ocean: #1B4965; --color-paper: #F5F0E8; --color-paper-dark: #EDE5D6; --color-gold: #C9A961; --color-ink: #2C2416; --color-ink-light: #5C5040; --color-ink-faint: #8A7E6C; --font-serif-zh: 'Noto Serif SC', 'Songti SC', 'SimSun', serif; --font-sans-zh: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; --font-serif-en: 'Playfair Display', Georgia, serif; --font-sans-en: 'Inter', 'Helvetica Neue', Arial, sans-serif;  /* ★ 毛笔字体：马善政毛笔楷书 */ --font-brush: 'Ma Shan Zheng', 'KaiTi', 'STKaiti', cursive; } * { margin: 0; padding: 0; box-sizing: border-box; } body { font-family: var(--font-sans-zh); background: transparent; color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px; position: relative; } /* ★ 整个页面底图，透明度40%，在最底层 */ body::before { content: ''; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-image: url('首页1.jpg'); background-size: cover; background-position: center; opacity: 0.4; z-index: -1; } .login-card { width: 100%; max-width: 960px; height: 580px; background: #fff; border-radius: 16px; box-shadow: 0 20px 60px rgba(44,36,22,0.12); display: flex; overflow: hidden; } .login-illustration { flex: 1; background: var(--color-paper-dark); position: relative; overflow: hidden; } .illustration-img { width: 100%; height: 100%; object-fit: contain; padding: 99px; display: none; position: relative; top: -80px; } .illustration-img[src]:not([src=""]) { display: block; } .illustration-img[src]:not([src=""]) ~ .illustration-placeholder { display: none; } .illustration-placeholder { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; color: var(--color-ink-faint); } .illustration-placeholder-icon { width: 72px; height: 72px; border: 2px dashed var(--color-ink-faint); border-radius: 12px; display: flex; align-items: center; justify-content: center; opacity: 0.5; } .illustration-placeholder-icon svg { width: 32px; height: 32px; stroke: var(--color-ink-faint); fill: none; stroke-width: 1.5; } .illustration-placeholder-text { font-size: 13px; letter-spacing: 1px; text-align: center; line-height: 1.8; } .illustration-caption { position: absolute; bottom: 15px; left: 28px; right: 28px; z-index: 2; background: rgba(245, 240, 232, 0.78); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: 16px 20px; border-radius: 10px; } /* ★ 中文标题用毛笔字体 */.illustration-caption-zh { font-family: var(--font-brush); font-size: 30px; font-weight: 400; color: var(--color-ink); line-height: 1.4; margin-bottom: 6px; letter-spacing: 2px; } .illustration-caption-en { font-family: var(--font-serif-en); font-size: 13px; font-style: italic; color: var(--color-ink-light); letter-spacing: 0.5px; } .illustration-caption::before { content: ''; display: block; width: 48px; height: 2px; background: var(--color-brick); margin-bottom: 8px; } .login-form-wrap { flex: 1; padding: 52px 44px 40px; display: flex; flex-direction: column; overflow-y: auto; } .login-header { margin-bottom: 18px; } .login-title-zh { font-family: var(--font-serif-zh); font-size: 24px; font-weight: 700; color: var(--color-ink); margin-bottom: 4px; } .login-title-en { font-family: var(--font-serif-en); font-size: 13px; color: var(--color-ink-faint); font-style: italic; } .form-tabs { display: flex; border-bottom: 2px solid var(--color-paper-dark); margin-bottom: 24px; gap: 32px; } .form-tab { background: none; border: none; padding: 10px 0; font-family: var(--font-serif-zh); font-size: 16px; font-weight: 600; color: var(--color-ink-faint); cursor: pointer; position: relative; transition: all 0.3s; } .form-tab::after { content: ''; position: absolute; bottom: -2px; left: 0; width: 0; height: 2px; background: var(--color-brick); transition: width 0.3s; } .form-tab.active { color: var(--color-brick); } .form-tab.active::after { width: 100%; } .form-panel { display: none; flex: 1; flex-direction: column; } .form-panel.active { display: flex; animation: fadeIn 0.3s ease; } @keyframes fadeIn { from {  opacity: 0;  transform: translateY(8px); }  to {  opacity: 1;  transform: translateY(0); } } /* 表单字段 —— 登录页和注册页统一大小 */.form-group { margin-bottom: 16px; } .form-label-zh { display: block; font-size: 18px; color: var(--color-ink); font-weight: 500; margin-bottom: 2px; } .form-label-en { display: block; font-size: 14px; color: var(--color-ink-faint); font-family: var(--font-serif-en); font-style: italic; margin-bottom: 6px; letter-spacing: 0.3px; } .form-input { width: 100%; padding: 11px 14px; border: 1px solid var(--color-paper-dark); border-radius: 8px; font-size: 14px; font-family: inherit; background: var(--color-paper); transition: all 0.3s; color: var(--color-ink); } .form-input:focus { outline: none; border-color: var(--color-brick); background: #fff; box-shadow: 0 0 0 3px rgba(181,73,59,0.08); } .error-msg { color: var(--color-brick); font-size: 12px; margin-bottom: 8px; min-height: 16px; } .form-btn { margin-top: auto; padding: 10px 13px; background: var(--color-brick); color: #fff; border: none; border-radius: 8px; font-size: 18px; font-weight: 600; cursor: pointer; transition: all 0.3s; font-family: inherit; letter-spacing: 2px; } .form-btn:hover { background: var(--color-brick-dark); transform: translateY(-1px); box-shadow: 0 6px 16px rgba(181,73,59,0.25); } .form-tip { margin-top: 14px; text-align: center; font-size: 14px; color: var(--color-ink-faint); } .form-tip span { color: var(--color-brick); cursor: pointer; font-weight: 500; } .form-tip span:hover { text-decoration: underline; } .guest-entry { margin-top: 16px; text-align: center; font-size: 13px; color: var(--color-ink-faint); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: color 0.3s; } .guest-entry:hover { color: var(--color-brick); } @media (max-width: 768px) { .login-card {  flex-direction: column;  height: auto;  max-width: 420px; }  .login-illustration {  height: 200px; }  .login-form-wrap {  padding: 32px 24px 28px; }  .illustration-caption {  bottom: 20px;  left: 24px; }  .illustration-caption-zh {  font-size: 24px; } }</style>
</head>
    <body>
        <div class="login-card">
            <div class="login-illustration">
                <!-- ★【在此处插入插图】把下面 src="" 的引号里填上图片地址 -->
                <img class="illustration-img" src="坐着动作.png" alt="泉州插图">
                <div class="illustration-placeholder">
                    <div class="illustration-placeholder-icon">
                        <svg viewBox="0 0 24 24">
                            <rect x="3" y="3" width="18" height="18" rx="2"/>
                            <circle cx="8.5" cy="8.5" r="1.5"/>
                            <path d="M21 15l-5-5L5 21"/>
                        </svg>
                    </div>
                    <div class="illustration-placeholder-text">
                        在此处插入插图<br>
                        <span style="font-size:11px;opacity:0.7;">Insert illustration here</span>
                    </div>
                </div>
            <!-- 左下角标题（毛笔字体） -->
                <div class="illustration-caption">
                    <div class="illustration-caption-zh">从一座城<br>读懂一个国
                    </div>
                    <div class="illustration-caption-en" style="font-size: 17px;">Understand China Through One City</div>
                </div>
            </div>
            <div class="login-form-wrap" style="padding-top: 25px; padding-bottom: 70px;">
                <div class="login-header">
                    <div class="login-title-zh">欢迎进入</div>
                    <div class="login-title-en" style="font-size: 16px;">Welcome to Living Quanzhou</div>
                </div>
                <div class="form-tabs">
                    <button class="form-tab active" data-tab="login" style="font-size: 20px;">登录</button>
                    <button class="form-tab" data-tab="register" style="font-size: 20px;">注册</button>
                </div>
                <!-- 登录面板 -->
                <div class="form-panel active" id="loginPanel">
                    <div class="form-group">
                        <label class="form-label-zh">邮箱</label>
                        <label class="form-label-en">Email</label>
                        <input type="email" class="form-input" id="loginUser" placeholder="请输入邮箱地址">
                    </div>
                    <div class="form-group">
                        <label class="form-label-zh">密码</label>
                        <label class="form-label-en">Password</label>
                        <input type="password" class="form-input" id="loginPass" placeholder="请输入密码">
                    </div>
                    <div class="error-msg" id="loginError"></div>
                    <button class="form-btn" onclick="handleLogin()">登 录</button>
                    <div class="form-tip">还没有账号？<span onclick="switchTab('register')">立即注册</span>
                    </div>
                    <div class="guest-entry" onclick="guestLogin()">
                        <svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        <span>游客浏览，直接进入</span>
                    </div>
                </div>
                <!-- 注册面板（字体已和登录页统一） -->
                <div class="form-panel" id="registerPanel">
                    <div class="form-group">
                        <label class="form-label-zh">设置账户名</label>
                        <label class="form-label-en">Set Username</label>
                        <input type="text" class="form-input" id="regUser" placeholder="请输入账户名">
                    </div>
                    <div class="form-group">
                        <label class="form-label-zh">邮箱地址</label>
                        <label class="form-label-en">Email Address</label>
                        <input type="email" class="form-input" id="regEmail" placeholder="请输入邮箱地址">
                    </div>
                    <div class="form-group">
                        <label class="form-label-zh">设置密码</label>
                        <label class="form-label-en">Set Password</label>
                        <input type="password" class="form-input" id="regPass" placeholder="请输入密码（至少6位）">
                    </div>
                    <div class="error-msg" id="regError"></div>
                    <button class="form-btn" onclick="handleRegister()">注 册</button>
                    <div class="form-tip">已有账号？<span onclick="switchTab('login')">直接登录</span>
                    </div>
                    <div class="guest-entry" onclick="guestLogin()">
                        <svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        <span>游客浏览，直接进入</span>
                    </div>
                </div>
            </div>
        </div>
        <script>
// ===== 全局变量 =====
const supabaseUrl = 'https://nceuksyqdrcutkvkrnef.supabase.co';
const supabaseAnonKey = 'sb_publishable_JIP6ZG87yBuY6A4pqRzy-w_wt16fwx_';
let supabase = null;

// 动态加载Supabase SDK（不阻塞页面）
(function() {
  const script = document.createElement('script');
  script.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
  script.onload = function() {
    try {
      supabase = window.supabase.createClient(supabaseUrl, supabaseAnonKey);
      console.log('Supabase初始化成功');
    } catch(e) {
      console.error('Supabase初始化失败', e);
    }
  };
  script.onerror = function() {
    console.error('Supabase SDK加载失败');
  };
  document.head.appendChild(script);
})();

// tab切换（全局函数，供HTML onclick调用）
function switchTab(tab) {
  document.querySelectorAll('.form-tab').forEach(t => t.classList.remove('active'));
  document.querySelector('.form-tab[data-tab="' + tab + '"]').classList.add('active');
  document.querySelectorAll('.form-panel').forEach(p => p.classList.remove('active'));
  document.getElementById(tab + 'Panel').classList.add('active');
  document.getElementById('loginError').textContent = '';
  document.getElementById('regError').textContent = '';
}

// 注册
async function handleRegister() {
  const username = document.getElementById('regUser').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const pass = document.getElementById('regPass').value;
  const error = document.getElementById('regError');
  if (!username) return error.textContent = '请输入账户名';
  if (!email) return error.textContent = '请输入邮箱地址';
  if (!pass) return error.textContent = '请输入密码';
  if (pass.length < 6) return error.textContent = '密码至少6位';
  if (!supabase) return error.textContent = '系统初始化中，请刷新页面重试';
  
  error.textContent = '注册中...';
  
  const { data, error: authError } = await supabase.auth.signUp({
    email: email,
    password: pass,
    options: { data: { username: username } }
  });
  
  if (authError) {
    error.textContent = authError.message;
    return;
  }
  
  if (data.user) {
    // 初始化该用户的印章记录
    try {
      await supabase.from('user_seals').insert({ user_id: data.user.id });
    } catch(e) {}
    
    localStorage.setItem('quanzhou_login', data.user.id);
    localStorage.setItem('quanzhou_username', username);
    localStorage.setItem('quanzhou_email', email);
    
    alert('注册成功，即将进入首页');
    window.location.href = '首页.html';
  }
}

// 登录
async function handleLogin() {
  const email = document.getElementById('loginUser').value.trim();
  const pass = document.getElementById('loginPass').value;
  const error = document.getElementById('loginError');
  if (!email) return error.textContent = '请输入邮箱';
  if (!pass) return error.textContent = '请输入密码';
  if (!supabase) return error.textContent = '系统初始化中，请刷新页面重试';
  
  error.textContent = '登录中...';
  
  const { data, error: authError } = await supabase.auth.signInWithPassword({
    email: email,
    password: pass
  });
  
  if (authError) {
    error.textContent = authError.message;
    return;
  }
  
  if (data.user) {
    // 每次登录清零印章进度
    try {
      await supabase.from('user_seals')
        .update({ seal_haisi: false, seal_feiyi: false, seal_gongye: false, seal_mintai: false })
        .eq('user_id', data.user.id);
    } catch(e) {}
    
    localStorage.setItem('quanzhou_login', data.user.id);
    const username = data.user.user_metadata?.username || email.split('@')[0];
    localStorage.setItem('quanzhou_username', username);
    localStorage.setItem('quanzhou_email', email);
    
    window.location.href = '首页.html';
  }
}

// 游客登录
function guestLogin() {
  localStorage.removeItem('quanzhou_login');
  localStorage.setItem('quanzhou_username', '游客');
  window.location.href = '首页.html';
}

// 绑定tab点击事件
document.querySelectorAll('.form-tab').forEach(tab => {
  tab.addEventListener('click', function() { switchTab(tab.dataset.tab); });
});

// 回车登录/注册
document.getElementById('loginPass').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') handleLogin();
});
document.getElementById('regPass').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') handleRegister();
});
</script>
    </body>
</html>
